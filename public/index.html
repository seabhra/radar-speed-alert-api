// ===================================================================
// SINCRONIZAR RADARES PENDENTES COM GITHUB
// ===================================================================
async function sincronizarRadaresPendentes() {
    if (RADAR_PENDENTES_SINCRONIZAR.length === 0) {
        showNotification('✅ Nenhum radar pendente de sincronização.');
        return;
    }

    if (!GITHUB_CONFIG.token) {
        showNotification('❌ Configure o token do GitHub primeiro.');
        return;
    }

    showNotification(`🔄 Sincronizando ${RADAR_PENDENTES_SINCRONIZAR.length} radares pendentes...`);

    let sucessos = 0;
    let falhas = 0;
    const aindaPendentes = [];

    for (const pendente of RADAR_PENDENTES_SINCRONIZAR) {
        try {
            await salvarRadarNoGitHub(pendente.radar, pendente.id, GITHUB_CONFIG.appPath || 'radares_app.json');
            sucessos++;
            console.log(`[Radar X9] ✅ Radar #${pendente.id} sincronizado.`);
        } catch (error) {
            falhas++;
            aindaPendentes.push(pendente);
            console.warn(`[Radar X9] ❌ Radar #${pendente.id} ainda pendente:`, error.message);
        }
    }

    RADAR_PENDENTES_SINCRONIZAR = aindaPendentes;
    try {
        localStorage.setItem('radarx9_pendentes', JSON.stringify(RADAR_PENDENTES_SINCRONIZAR));
    } catch (e) {}

    if (sucessos > 0) {
        showNotification(`✅ ${sucessos} radar(es) sincronizado(s)!`);
        carregarRadares(); 
    }
    if (falhas > 0) {
        showNotification(`⚠️ ${falhas} radar(es) ainda pendente(s).`);
    }
}

        if (pendentes) {
            RADAR_PENDENTES_SINCRONIZAR = JSON.parse(pendentes);
            console.log('[Radar X9] 📦 Radares pendentes carregados:', RADAR_PENDENTES_SINCRONIZAR.length);
        }
    } catch (e) {
        console.warn('[Radar X9] Erro ao carregar pendentes:', e);
    }
}


// =====================================================================
// FETCH COM TIMEOUT (evita travamento silencioso em WebViews restritos)
// =====================================================================
function fetchComTimeout(url, opcoes, timeoutMs) {
    timeoutMs = timeoutMs || 8000;
    return Promise.race([
        fetch(url, opcoes),
        new Promise(function(_, reject) {
            setTimeout(function() { reject(new Error('Timeout: ' + url)); }, timeoutMs);
        })
    ]);
}

// ===============================
// CARREGAR RADARES GITHUB VIA CDN
// ===============================
async function carregarRadares() {
    if (!map) return;
    if (radarMarkers.length > 0) { radarMarkers.forEach(function(marker) { map.removeLayer(marker); }); radarMarkers = []; }
    $("#loading").show().html("<div class='loading-spinner'></div><div>Carregando alertas...</div>");

    let recordsCurados = [];
    let recordsUsuarios = [];
    let fonte = '';
   
    //==========================================
    // ---- 1. Radares curados (radares.json) ----
    //===========================================

    try {
        const cdnResponse = await fetchComTimeout(GITHUB_CONFIG.cdnUrl + '?v=' + Date.now(), { headers: { 'Accept': 'application/json' } }, 8000);
        if (cdnResponse.ok) {
            const data = await cdnResponse.json();
            recordsCurados = (Array.isArray(data)) ? data : (data.result?.records || data.records || []);
            if (recordsCurados.length > 0) { fonte = 'GitHub (CDN)'; RADAR_MODO_OFFLINE = false; }
        }
    } catch (e) { console.warn('[Radar X9] CDN curado falhou:', e.message); }

    if (recordsCurados.length === 0) {
        try {
            const rawResponse = await fetchComTimeout(GITHUB_CONFIG.rawUrl + '?v=' + Date.now(), { headers: { 'Accept': 'application/json' } }, 8000);
            if (rawResponse.ok) {
                const data = await rawResponse.json();
                recordsCurados = (Array.isArray(data)) ? data : (data.result?.records || data.records || []);
                if (recordsCurados.length > 0) { fonte = 'GitHub (Raw)'; RADAR_MODO_OFFLINE = false; }
            }
        } catch (e) { console.warn('[Radar X9] Raw curado falhou:', e.message); }
    }

    if (recordsCurados.length === 0) {
        try {
            var response = await fetchComTimeout('radares.json?v=' + Date.now(), {}, 8000);
            if (response.ok) {
                var data = await response.json();
                recordsCurados = (Array.isArray(data)) ? data : (data.result?.records || data.records || []);
                if (recordsCurados.length > 0) { fonte = 'Local'; RADAR_MODO_OFFLINE = true; }
            }
        } catch (e) { console.warn('[Radar X9] Arquivo local curado falhou:', e.message); }
    }

    //===========================================================================
    // ---- 2. Radares enviados por usuários (radares_app.json) ----
    //===========================================================================
    // CORREÇÃO: Substituído o código de backend (SHA/Blob/Buffer) por fetch direto via CDN/Raw.
    // O GitHub serve arquivos JSON publicamente, não há necessidade de API autenticada para LER.

    try {
        const cdnAppResponse = await fetchComTimeout(GITHUB_CONFIG.cdnUrlApp + '?v=' + Date.now(), { headers: { 'Accept': 'application/json' } }, 8000);
        if (cdnAppResponse.ok) {
            const data = await cdnAppResponse.json();
            recordsUsuarios = (Array.isArray(data)) ? data : (data.result?.records || data.records || []);
            if (recordsUsuarios.length > 0) console.log('[Radar X9] ✅ Radares de usuários carregados (CDN App)');
        }
    } catch (e) { console.warn('[Radar X9] CDN App falhou:', e.message); }

    if (recordsUsuarios.length === 0) {
        try {
            const rawAppResponse = await fetchComTimeout(GITHUB_CONFIG.rawUrlApp + '?v=' + Date.now(), { headers: { 'Accept': 'application/json' } }, 8000);
            if (rawAppResponse.ok) {
                const data = await rawAppResponse.json();
                recordsUsuarios = (Array.isArray(data)) ? data : (data.result?.records || data.records || []);
                if (recordsUsuarios.length > 0) console.log('[Radar X9] ✅ Radares de usuários carregados (Raw App)');
            }
        } catch (e) { console.warn('[Radar X9] Raw App falhou:', e.message); }
    }

    // Fallback local para radares de usuários
    if (recordsUsuarios.length === 0) {
        try {
            var responseApp = await fetchComTimeout('radares_app.json?v=' + Date.now(), {}, 8000);
            if (responseApp.ok) {
                var dataApp = await responseApp.json();
                recordsUsuarios = (Array.isArray(dataApp)) ? dataApp : (dataApp.result?.records || dataApp.records || []);
                if (recordsUsuarios.length > 0) console.log('[Radar X9] ✅ Radares de usuários carregados (Local)');
            }
        } catch (e) { console.warn('[Radar X9] Arquivo local App falhou:', e.message); }
    }

    // ---- 3. Fallback: cache local (mescla ambos, se existirem) ----
    if (recordsCurados.length === 0 && recordsUsuarios.length === 0) {
        try {
            const cached = localStorage.getItem('radarx9_radares_cache');
            if (cached) {
                const data = JSON.parse(cached);
                recordsCurados = data.recordsCurados || [];
                recordsUsuarios = data.recordsUsuarios || [];
                fonte = 'Cache Local';
                RADAR_MODO_OFFLINE = true;
            }
        } catch (e) { console.warn('[Radar X9] Cache falhou:', e.message); }
    }

    // ---- 4. Renderizar: curados normalmente, usuários com origem marcada ----
    if (recordsCurados.length > 0) {
        renderizarRadaresNoMapa(recordsCurados, fonte, false);
    } else {
        showNotification('⚠️ Base curada (radares.json) não carregou — CDN, raw e local falharam ou expiraram.');
        console.warn('[Radar X9] Base curada vazia após todas as tentativas.');
    }

    if (recordsUsuarios.length > 0) {
        renderizarRadaresNoMapa(recordsUsuarios, 'Compartilhados por usuários', true);
    }
    

  if (recordsCurados.length > 0 || recordsUsuarios.length > 0) {
        try {
            localStorage.setItem('radarx9_radares_cache', JSON.stringify({ recordsCurados: recordsCurados, recordsUsuarios: recordsUsuarios }));
        } catch (e) {}
    } else {
        RADAR_MODO_OFFLINE = true;
    }

    // [ADICIONADO] Reinsere radares desta sessão que ainda não voltaram
    // na resposta do CDN (cache da jsdelivr/raw.githubusercontent costuma
    // levar mais tempo que o esperado para refletir um commit novo)

    if (radaresAdicionadosNestaSessao.length > 0) {
        radaresAdicionadosNestaSessao.forEach(function(item) {
            var jaExiste = radarMarkers.some(function(m) {
                return m.radarData &&
                       Math.abs(m.radarData.latitude - item.radar.latitude) < 0.00001 &&
                       Math.abs(m.radarData.longitude - item.radar.longitude) < 0.00001;
            });
            if (!jaExiste) {
                var markerRecriado = criarRadarNoMapa({
                    ...item.radar,
                    id: item.id,
                    tipoOriginal: item.radar.tipo,
                    isUsuario: true
                });
                if (markerRecriado) {
                    radarMarkers.push(markerRecriado);
                    console.log('[Radar X9] 🧩 Radar #' + item.id + ' reinserido (ainda não propagado no CDN)');
                }
            } else {
                console.log('[Radar X9] ✅ Radar #' + item.id + ' já veio do CDN, removendo da lista de sessão');
            }
        });

        // Limpa da lista de sessão os que já vieram confirmados pelo CDN
        radaresAdicionadosNestaSessao = radaresAdicionadosNestaSessao.filter(function(item) {
            return !radarMarkers.some(function(m) {
                return m.radarData && m.radarData.id === item.id && m.radarData.isUsuario;
            }) || !recordsUsuarios.some(function(r) {
                var coords = String(r[9] || '').split(',').map(function(s){return parseFloat(s.trim());});
                return coords.length === 2 &&
                       Math.abs(coords[0] - item.radar.latitude) < 0.00001 &&
                       Math.abs(coords[1] - item.radar.longitude) < 0.00001;
            });
        });
    }

    $("#loading").hide();
}

// ==============================
// RENDERIZAR RADARES APP NO MAPA
// ==============================

function renderizarRadaresNoMapa(records, origem, isUsuario) {
    if (!map) return;
    var radaresExternos = records || [];
    var contador = 0;
    var idOffset = isUsuario ? 100000 : 0;
    
    console.log('[Radar X9] 📊 Renderizando ' + radaresExternos.length + ' radares de: ' + origem);

    for (var i = 0; i < radaresExternos.length; i++) {
        var record = radaresExternos[i];
        
        // Log para depuração
        console.log('[Radar X9] Registro ' + i + ':', record);
        
        var coords = extrairCoordenadas(record, i);
        if (!coords) {
            console.warn('[Radar X9] ⚠️ Coordenadas não encontradas para registro ' + i + ':', record);
            continue;
        }

        console.log('[Radar X9] ✅ Coordenadas extraídas:', coords);
        
        var finalLat = coords.lat;
        var finalLng = coords.lng;
        var endereco = record[2] || "Endereço não informado";
        var tipo = (record[3] || "Não Identificado").trim();
        var velocidade = record[4] || "0";

        var iconeUrl = getIconUrl(tipo, velocidade);
        var fallbackUrl = 'imagens_app/ic_radar_cev_v2.png'; 
        var iconeRadar = criarIconeRadar(iconeUrl, 40, fallbackUrl);

        var radarMarker = L.marker([finalLat, finalLng], { icon: iconeRadar }).addTo(map);

        setTimeout(function(mk, fb) {
            return function() {
                var el = mk.getElement();
                if (el) { var imgEl = el.querySelector('img'); if (imgEl) imgEl.setAttribute('data-fallback', fb); }
            };
        }(radarMarker, fallbackUrl), 100);

        var tipoExibicao = ajusteNomes[tipo] || tipo;
        var isIA = tipoExibicao.includes('OCR') || tipoExibicao.includes('FACIAL');

        //===============================================================
        // [ADICIONADO] selo visual para radares enviados pela comunidade
        //===============================================================

        var seloUsuario = isUsuario ? '<div style="color:#66A775;font-size:0.85rem;margin-top:4px;font-weight:bold;">🧩 Compartilhado por usuários</div>' : '';
        var tituloPopup = isIA ? '<span style="color:#33aaff">' + tipoExibicao + '</span>' : '<b>' + tipoExibicao + '</b>';

        radarMarker.bindPopup(
            '<div style="color:#222; font-family:\'Inter\'; text-align:center; min-width:200px;">' +
            tituloPopup + '<br><hr style="border:0; border-top:1px solid #ddd; margin:5px 0;">' +
            endereco + '<br><div style="color:#d00; font-weight:bold; margin-top:5px;">Máx: ' + velocidade + ' km/h</div>' +
            seloUsuario + '</div>'
        );

        radarMarker.radarData = {
            id: idOffset + i, latitude: finalLat, longitude: finalLng,
            endereco: endereco, velocidade_maxima: velocidade,
            tipoOriginal: tipo, tipoExibicao: tipoExibicao, isIA: isIA,
            isUsuario: !!isUsuario // [ADICIONADO]
        };
        radarMarkers.push(radarMarker);
        contador++;
    }

    $("#loading").hide();
    if (contador > 0) showNotification('Base carregada: ' + origem + ' (' + contador + ' radares)');
}

// =======================
// FUNÇÃO BUSCAR RADARES
// =======================

function buscarRadares(query) {
    if (!query || query.length < 2) return;
    var encontrou = false;
    var boundsGroup = L.featureGroup();
    var q = query.toLowerCase();
    radarMarkers.forEach(function(marker) {
        var d = marker.radarData;
        if ((d.endereco + ' ' + d.tipoOriginal + ' ' + d.tipoExibicao).toLowerCase().includes(q)) {
            encontrou = true; boundsGroup.addLayer(marker); marker.openPopup();
        }
    });
    if (encontrou) { if (map) map.fitBounds(boundsGroup.getBounds().pad(0.2)); isFollowing = false; }
    else showNotification("Nenhum radar encontrado para: " + query);
}

function showError(error) {
    if (gpsSource === 'appinventor') return;
    var msg = "Erro ao obter localização.";
    if (error.code === 1) msg = "Permissão de GPS negada.";
    if (error.code === 2) msg = "Sinal GPS indisponível.";
    if (error.code === 3) msg = "Tempo esgotado. Tentando novamente...";
    showNotification(msg); hideFullscreenLoading();
    if (error.code === 3) setTimeout(startGPSTracking, 5000);
}

function inicializarBussolaHardware() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        console.log('[Radar X9] Bússola iOS detectada'); return;
    }
    if (typeof DeviceOrientationEvent !== 'undefined') {
        window.addEventListener('deviceorientation', function(event) {
            if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) { currentHeading = event.webkitCompassHeading; bussolaHardwareDisponivel = true; }
            else if (event.alpha !== null && event.absolute === true) { currentHeading = event.alpha; bussolaHardwareDisponivel = true; }
        }, true);
        console.log('[Radar X9] deviceorientation listener registrado');
    } else console.warn('[Radar X9] deviceorientation API não disponível');
}

async function solicitarPermissaoBussolaIOS() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            var resposta = await DeviceOrientationEvent.requestPermission();
            if (resposta === 'granted') {
                window.addEventListener('deviceorientation', function(event) {
                    if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) { currentHeading = event.webkitCompassHeading; bussolaHardwareDisponivel = true; }
                }, true);
                return true;
            }
            return false;
        } catch (erro) { return false; }
    }
    return false;
}

// =====================================
// NOVA FORMA DE INTEGRAÇÃO APP INVENTOR
// =====================================
var ultimoWebViewString = '';

function enviarAlertaSonoroParaAppInventor(tipoAlerta) {

    if (typeof AppInventor === 'undefined') {
        console.warn('[Radar X9] AppInventor não disponível');
        return false;
    }

    var mapaTextos = {
        radar: 'RADAR',
        risco: 'RISCO',
        mobilidade: 'MOBILIDADE',
        destaque: 'DESTAQUE',
        clima: 'CLIMA'
    };

    var texto = mapaTextos[tipoAlerta];

    if (!texto) {
        console.warn('[Radar X9] Tipo de alerta desconhecido:', tipoAlerta);
        return false;
    }

    try {

        AppInventor.setWebViewString(texto);

        ultimoWebViewString = texto;

        console.log(
            '[Radar X9] → App Inventor:',
            texto
        );

        return true;

    } catch (e) {

        console.error(
            '[Radar X9] Erro ao enviar para App Inventor:',
            e
        );

        return false;
    }
}



// ====================================
// FUNÇÃO RECEBER DADOS DO APP INVENTOR
// ====================================

function receberDadosAppInventor(dadosStr) {
    if (!dadosStr || typeof dadosStr !== 'string') return;
    var partes = dadosStr.split('|');
    var acao = partes[0];
    if (acao === 'GPS' && partes.length >= 3) {
        var lat = parseFloat(partes[1]);
        var lng = parseFloat(partes[2]);
        var speed = partes[3] ? parseFloat(partes[3]) : 0;
        var heading = partes[4] ? parseFloat(partes[4]) : null;
        if (heading === -1 || isNaN(heading)) heading = null;
       
        // [CORREÇÃO] Precisão vinda do App Inventor (posição 5); fallback fixo de 50m se ausente
        var accuracy = (partes[5] !== undefined && partes[5] !== '') ? parseFloat(partes[5]) : 50;
        if (isNaN(accuracy)) accuracy = 50;
        if (!isNaN(lat) && !isNaN(lng) && (lat !== 0 || lng !== 0)) {
            gpsSource = 'appinventor';
            processarNovaPosicao(lat, lng, speed, heading, accuracy);
        }
    }
}
